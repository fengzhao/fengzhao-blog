name: Build Hugo and Deploy to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 需要向 gh-pages 分支推送，所以要有写权限
permissions:
  contents: write

# 防止两次推送同时部署，造成 gh-pages 分支冲突
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.167.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PaperMod 主题是 submodule，必须递归拉取，否则构建时找不到主题
          submodules: recursive
          # 拉取完整历史，供 Hugo 生成 .GitInfo / lastmod
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: |
            resources/_gen
            ~/.cache/hugo_cache
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum', '**/hugo.toml', '**/config.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build
        run: hugo --minify --gc

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          # 每次只保留一次提交，避免 gh-pages 分支历史无限膨胀
          force_orphan: true
          # 自动生成 .nojekyll，防止 GitHub Pages 用 Jekyll 处理 Hugo 产物
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
